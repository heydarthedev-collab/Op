
name: Debian VPS + MCSManager

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      REQUIRED_RAM_GB: "16"
      VPS_LIFETIME_HOURS: "6"
      MCSM_WEB_PORT: "23333"
      MCSM_DAEMON_PORT: "24444"

    steps:
      - name: Install MCSManager on Debian VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_SSH_KEY" ]]; then
            echo "::error::Set VPS_HOST, VPS_USER and VPS_SSH_KEY in GitHub Secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          trap 'rm -f ~/.ssh/vps_key' EXIT

          ssh -i ~/.ssh/vps_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            "sudo bash -s -- '$REQUIRED_RAM_GB' '$VPS_LIFETIME_HOURS' '$MCSM_WEB_PORT' '$MCSM_DAEMON_PORT'" <<'REMOTE'
          set -euo pipefail

          REQUIRED_RAM_GB="$1"
          LIFETIME_HOURS="$2"
          WEB_PORT="$3"
          DAEMON_PORT="$4"

          if [ ! -f /etc/debian_version ]; then
            echo "ERROR: Debian Linux is required."
            exit 1
          fi

          RAM_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MIN_RAM_KB=$((REQUIRED_RAM_GB * 1000000))

          echo "Detected RAM: $((RAM_KB / 1000000)) GB"

          if [ "$RAM_KB" -lt "$MIN_RAM_KB" ]; then
            echo "ERROR: VPS has less than 16 GB RAM."
            exit 1
          fi

          apt-get update
          apt-get install -y curl wget ca-certificates

          wget -qO- https://script.mcsmanager.com/setup.sh | bash

          systemctl enable --now mcsm-web.service
          systemctl enable --now mcsm-daemon.service

          systemctl is-active --quiet mcsm-web.service
          systemctl is-active --quiet mcsm-daemon.service

          systemd-run \
            --unit=vps-auto-shutdown \
            --on-active="${LIFETIME_HOURS}h" \
            /usr/sbin/shutdown -h now

          echo "MCSManager installation successful."
          echo "Web port: ${WEB_PORT}"
          echo "Daemon port: ${DAEMON_PORT}"
          echo "Shutdown scheduled in ${LIFETIME_HOURS} hours."
          REMOTE

          if [[ "$VPS_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PANEL_URL="http://${VPS_HOST}:${MCSM_WEB_PORT}/"
          elif [[ "$VPS_HOST" == *:* ]]; then
            PANEL_URL="http://[${VPS_HOST}]:${MCSM_WEB_PORT}/"
          else
            PANEL_URL="http://${VPS_HOST}:${MCSM_WEB_PORT}/"
          fi

          echo "=================================="
          echo "MCSManager Panel: ${PANEL_URL}"
          echo "=================================="
