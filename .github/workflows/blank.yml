
name: Free MCSManager Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check Linux and RAM
        run: |
          set -e
          echo "Operating system:"
          cat /etc/os-release
          echo
          echo "Available memory:"
          free -h
          echo
          echo "Disk space:"
          df -h /

      - name: Install MCSManager
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl wget ca-certificates

          wget -qO- https://script.mcsmanager.com/setup.sh | sudo bash

          echo "MCSManager installation command completed."
          echo "Checking available services:"
          systemctl list-unit-files 'mcsm*' --no-pager || true

      - name: Keep test running
        run: |
          echo "This is a temporary GitHub Actions runner."
          echo "It is not a permanent VPS and has no guaranteed public URL."
          sleep 60
